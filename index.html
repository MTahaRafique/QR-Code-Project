<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>QR Code Generator</h1>

    <form method="POST">

        <input type="text"
               name="url"
               placeholder="Enter URL"
               required>

        <button type="submit">
            Generate QR
        </button>

    </form>

    {% if qr_image %}

        <img src="{{ qr_image }}">

    {% endif %}

</div>

</body>
</html>
